{% extends 'users/profile_base.html' %}

{% block profile_content %}

<div class="card border-0 shadow-sm p-4 rounded-4 mb-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'users:settings' %}" class="text-dark me-3">
            <i class="bi bi-arrow-left fs-4"></i>
        </a>
        <h4 class="mb-0 fw-bold">Change Password</h4>
    </div>

    <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="mb-4">
                <label class="fw-bold mb-2 small text-muted text-uppercase">
                    {{ field.label }}
                </label>
                
                <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control border-secondary p-2" required id="{{ field.id_for_label }}">
                
                <div class="small text-muted mt-1">
                    {{ field.help_text|safe }}
                </div>
                
                {% if field.errors %}
                    <div class="text-danger small mt-1 fw-bold">
                        {{ field.errors.0 }}
                    </div>
                {% endif %}

            </div>
        {% endfor %}

        <div class="d-flex justify-content-end border-top pt-4">
            <button type="submit" class="btn btn-dark px-5 rounded-pill fw-bold">Update Password</button>
        </div>
    </form>
</div>

{% endblock %}
