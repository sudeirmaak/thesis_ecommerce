{% extends 'base.html' %}
{% block content%}

<div class="container py-5">

    <div class="mb-4">
        <a href="{% url 'home' %}" class="text-dark me-3">
            <i class="bi bi-arrow-left fs-3"></i>
        </a>
    </div>
    
    <h1>General Logic - Style Later</h1>
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 border-0 shadow-sm">

                {% if product.image %}
                    <img class="card-img-top" src="{{ product.image.url }}" style="object-fit: cover; height: 350px;">
                {% else %}
                    <div class="card-img-top bg-secondary d-flex align-items-center justify-content-center text-white" style="height: 350px;">
                        <i class="bi bi-camera bg-secondary" style="font-size: 3rem;"></i>
                    </div>
                {% endif %} 
                
                <div class="card-body text-center">
                    <h5>{{ product.name }}</h5>
                    <p>{{ product.category.name }}</p>
                    <p><strong>${{ product.price }}</strong></p>
                    <a class="btn btn-dark" href="{% url 'product_detail' product.slug %}">View Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
