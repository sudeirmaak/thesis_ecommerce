{% extends 'base.html' %}
{% block content %}

<div class="container py-5">

    <div class="mb-4">
        <a href="{% url 'home' %}" class="text-dark me-3">
            <i class="bi bi-arrow-left fs-3"></i>
        </a>
    </div>

    <div class="row gx-5 align-items-center">
        <div class="col-md-6 mb-4">
            <img src="{{ product.image.url }}" class="img-fluid w-100 rounded shadow-sm">
        </div>
        <div class="col-md-6 mb-5 mb-md-0">
            <h1>{{ product.name }}</h1>
            <!-- Dummy Stars for now-->
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-half text-warning"></i>
            <span class="ms-2">4.5 (124 reviews)</span>

            <h2 id="display-price" data-base-price="{{ product.price }}">${{ product.price }}</h2>

            <form action="{% url 'add_to_cart' product.id %}" method="POST">
                {% csrf_token %}

                {% if product.category.slug != 'brewing-equipment' %}
                    <label class="fw-bold mb-2">Size:</label>
                    <div class="btn-group w-100 mb-4">
                        <input type="radio" class="btn-check" name="size" id="size_250" value="250g" autocomplete="off" checked>
                        <label class="btn btn-outline-dark" for="size_250">250g</label>

                        <input type="radio" class="btn-check" name="size" id="size_500" value="500g" autocomplete="off">
                        <label class="btn btn-outline-dark" for="size_500">500g</label>

                        <input type="radio" class="btn-check" name="size" id="size_1kg" value="1kg" autocomplete="off">
                        <label class="btn btn-outline-dark" for="size_1kg">1kg</label>
                    </div>

                    <label class="fw-bold mb-2">Grind:</label>
                    <select name="grind" class="form-select mb-4 border-dark">
                        <option value="Whole Bean">Whole Bean</option>
                        <option value="Espresso">Espresso</option>
                        <option value="Filter">Filter</option>
                    </select>

                    <label class="fw-bold mb-2">Purchase Option:</label>
                    <div class="btn-group w-100 mb-4">
                        <input type="radio" class="btn-check" name="purchase" id="one_time" value="one_time" autocomplete="off" checked>
                        <label class="btn btn-outline-dark" for="one_time">One-Time</label>

                        <input type="radio" class="btn-check" name="purchase" id="subscription" value="subscribe" autocomplete="off">
                        <label class="btn btn-outline-dark" for="subscription">Subscription</label>
                    </div>

                    <div id="frequency-container" class="d-none mb-4 p-3 bg-light rounded border border-success">
                        <label class="fw-bold mb-2 text-success"><i class="bi bi-tag-fill"></i> Subscribe & Save 10%</label>
                        <select name="frequency" class="form-select border-success">
                            <option value="M">Delivery Every 1 Month</option>
                            <option value="W">Delivery Every 1 Week</option>
                        </select>
                    </div>

                {% else %}
                    <input type="hidden" name="size" value="">
                    <input type="hidden" name="grind" value="">
                    <input type="hidden" name="purchase" value="one_time">

                {% endif %}

                <div class="d-flex align-items-stretch gap-3 mt-4">
                    <div class="input-group" style="width: 140px;">
                        <button class="btn btn-outline-dark" type="button" onclick="this.nextElementSibling.stepDown();">
                            <i class="bi bi-dash"></i>
                        </button>
                        <input type="number" name="quantity" value="1" min="1" class="form-control text-center border-dark">
                        <button class="btn btn-outline-dark" type="button" onclick="this.previousElementSibling.stepUp();">
                            <i class="bi bi-plus"></i>
                        </button>
                    </div>
                    
                    <button type="submit" class="btn btn-dark flex-grow-1 shadow-sm">
                        ADD TO CART
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const sizeRadios = document.querySelectorAll('input[name="size"]');
        const priceDisplay = document.getElementById('display-price');
        const purchaseRadios = document.querySelectorAll('input[name="purchase"]');
        const frequencyContainer = document.getElementById('frequency-container');

        let basePrice = parseFloat(priceDisplay.getAttribute('data-base-price'));

        function calculatePrice() {
            let sizeMultiplier = 1.0;
            let discountMultiplier = 1.0;

            const selectedSize = document.querySelector('input[name="size"]:checked')?.value;
            if (selectedSize === '500g') {
                sizeMultiplier = 1.8;
            } else if (selectedSize === '1kg') {
                sizeMultiplier = 3.5;
            }

            const selectedPurchase = document.querySelector('input[name="purchase"]:checked')?.value;
            if (selectedPurchase === 'subscribe') {
                discountMultiplier = 0.90; // 10% discount
                if(frequencyContainer) frequencyContainer.classList.remove('d-none');
            } else {
                if(frequencyContainer) frequencyContainer.classList.add('d-none');
            }

            const newPrice = (basePrice * sizeMultiplier * discountMultiplier).toFixed(2);
            priceDisplay.innerText = '$' + newPrice;
        }

        sizeRadios.forEach(radio => radio.addEventListener('change', calculatePrice));
        if (purchaseRadios) {
            purchaseRadios.forEach(radio => radio.addEventListener('change', calculatePrice));
        }
    });

</script>

{% endblock %}
